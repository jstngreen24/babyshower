<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brookie Green Baby Girl Registry</title>

  <style>
    :root {
      --sage: #e8f5e9;
      --green: #5f8f62;
      --green-dark: #315c37;
      --blush: #fde2e4;
      --cream: #fffaf5;
      --text: #2c3a2f;
      --muted: #6b7280;
      --shadow: 0 18px 45px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at top left, #ffffff, var(--cream)),
        radial-gradient(circle at bottom right, var(--blush), #fff);
      padding: 20px;
      color: var(--text);
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    .hero {
      background: rgba(255,255,255,0.9);
      border-radius: 30px;
      padding: 50px 25px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .name {
      font-size: 2.7rem;
      font-weight: 800;
      color: var(--green-dark);
    }

    .girl {
      font-size: 1.2rem;
      margin-top: 6px;
      color: #d97787;
      font-weight: 600;
    }

    h1 {
      margin: 10px 0;
      font-size: 2rem;
    }

    .subtitle {
      color: var(--muted);
      max-width: 500px;
      margin: 10px auto 20px;
    }

    .section {
      margin-top: 25px;
      background: white;
      border-radius: 25px;
      padding: 25px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .btn {
      display: block;
      margin-top: 12px;
      padding: 14px;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: transform 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .venmo { background: #3d95ce; }
    .amazon { background: #7c9cff; }
    .walmart { background: #48b57a; }

    .qr {
      max-width: 230px;
      margin-top: 15px;
      border-radius: 12px;
    }

    .cards {
      display: grid;
      gap: 18px;
      margin-top: 25px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-weight: 600;
      color: var(--green-dark);
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="hero">

      <div class="name">Brookie Green</div>
      <div class="girl">It’s a Girl 💕</div>

      <h1>Baby Registry</h1>

      <p class="subtitle">
        We are so excited to welcome our sweet baby girl 💕  
        Thank you for your love and support!
      </p>

    </section>

    <!-- VENMO FIRST -->
    <section class="section">
      <h2>💸 Send a Gift via Venmo</h2>

      <a class="btn venmo"
        href="https://venmo.com/code?user_id=2538942092017664281&created=1777216655"
        target="_blank">
        Pay with Venmo
      </a>

      <p>Or scan below 👇</p>

      <img src="venmo.png" alt="Venmo QR Code" class="qr">

      <p><strong>@BrookieGreen</strong></p>
    </section>

    <!-- REGISTRIES -->
    <section class="section">
      <h2>🛍️ Registries</h2>

      <div class="cards">
        <div class="card">
          <h3>Amazon</h3>
          <a class="btn amazon"
            href="https://www.amazon.com/baby-reg/brookie-green-august-2026-thatcher/2TOFJDGUUG4NX?ref_=cm_sw_r_cp_ud_dp_KGRDEMD7QFQE9E6X50KZ"
            target="_blank">View Amazon</a>
        </div>

        <div class="card">
          <h3>Walmart</h3>
          <a class="btn walmart"
            href="https://www.walmart.com/registry/BR/0dd35a6e-e24a-4aa3-8718-8cf38766e9a1"
            target="_blank">View Walmart</a>
        </div>
      </div>
    </section>

    <footer>
      Thank you for celebrating with us 💖
    </footer>

  </main>
</body>
</html>
