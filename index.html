<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brookie Green Registry</title>

  <style>
    :root {
      --bg: #f4f8f3;
      --card: #ffffff;
      --green: #4f8f5f;
      --green-dark: #2f5d3a;
      --sage: #dcead7;
      --text: #1f2937;
      --muted: #6b7280;
      --shadow: 0 12px 35px rgba(47, 93, 58, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #ffffff 0%, #f4f8f3 45%, #dcead7 100%);
      color: var(--text);
      padding: 24px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    .hero {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      padding: 48px 28px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .name {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--green-dark);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--green-dark);
    }

    .subtitle {
      margin: 16px auto;
      color: var(--muted);
      max-width: 600px;
    }

    .cards {
      margin-top: 30px;
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .btn {
      display: block;
      margin-top: 12px;
      padding: 14px;
      text-align: center;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    .amazon { background: #5b7cfa; }
    .walmart { background: #26a269; }
    .venmo { background: #3d95ce; }

    .section {
      margin-top: 24px;
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .qr {
      max-width: 250px;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      color: var(--green-dark);
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="hero">
      <div class="name">Brookie Green</div>

      <h1>Baby Registry</h1>

      <p class="subtitle">
        Thank you for celebrating this special time with us 💚
      </p>

      <div class="cards">
        <div class="card">
          <h2>Amazon Registry</h2>
          <a class="btn amazon"
            href="https://www.amazon.com/baby-reg/brookie-green-august-2026-thatcher/2TOFJDGUUG4NX?ref_=cm_sw_r_cp_ud_dp_KGRDEMD7QFQE9E6X50KZ"
            target="_blank">View Amazon</a>
        </div>

        <div class="card">
          <h2>Walmart Registry</h2>
          <a class="btn walmart"
            href="https://www.walmart.com/registry/BR/0dd35a6e-e24a-4aa3-8718-8cf38766e9a1"
            target="_blank">View Walmart</a>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Send a Gift via Venmo</h2>

      <a class="btn venmo"
        href="https://venmo.com/code?user_id=2538942092017664281&created=1777216655"
        target="_blank">
        Pay with Venmo
      </a>

      <p>Or scan below:</p>

      <!-- Save your uploaded QR as venmo.png -->
      <img src="venmo.png" alt="Venmo QR Code" class="qr">

      <p><strong>@BrookieGreen</strong></p>
    </section>

    <footer>
      Thank you for growing with the Green family 🌿
    </footer>

  </main>
</body>
</html>
